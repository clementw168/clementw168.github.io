<style>
.acad {
    --t-text: #e5e7eb;
    --t-muted: #9ca3af;
    --t-border: #374151;
    --t-blue: #4a9eff;
    --t-green: #34d399;
    --t-purple: #a78bfa;
    --t-orange: #fb923c;
    color: var(--t-text);
    margin-bottom: 60px;
}

/* Sections */
.acad-section-title {
    margin: 10px 0 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--t-border);
    font-size: 1.6em;
    font-weight: 400;
    color: var(--t-text);
}

.acad-section-title .fa {
    color: var(--t-blue);
    margin-right: 6px;
}

.acad-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr));
    gap: 24px;
    margin-bottom: 45px;
}

/* Cards */
.acad-card {
    --accent: var(--t-blue);
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow-wrap: anywhere;
    background: linear-gradient(145deg, #1e1e3f 0%, #2d2d4a 100%);
    border: 1px solid var(--t-border);
    border-top: 4px solid var(--accent);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.acad-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
}

.acad-card.accent-green  { --accent: var(--t-green); }
.acad-card.accent-purple { --accent: var(--t-purple); }
.acad-card.accent-orange { --accent: var(--t-orange); }

.acad-org {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.07);
    color: var(--accent);
    font-size: 0.8em;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
}

.acad-card h3 {
    margin: 12px 0 14px;
    font-size: 1.35em;
    line-height: 1.3;
    font-weight: 500;
    color: var(--t-text);
}

.acad-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 16px;
    padding: 0;
    list-style: none;
}

.acad-chips li {
    padding: 4px 11px;
    border: 1px solid var(--t-border);
    border-radius: 6px;
    background: rgba(15, 15, 35, 0.45);
    font-size: 0.85em;
    color: var(--t-text);
}

.acad-chips .fa {
    margin-right: 5px;
    color: var(--accent);
}

.acad-desc {
    margin: 0 0 18px;
    line-height: 1.65;
    color: var(--t-muted);
}

.acad-points {
    margin: -6px 0 18px;
    padding-left: 20px;
    color: var(--t-muted);
    line-height: 1.6;
}

.acad-points li {
    margin-bottom: 4px;
}

.acad-points li::marker {
    color: var(--accent);
}

/* Authors line (research cards) */
.acad-authors {
    margin: -6px 0 14px;
    font-size: 0.9em;
    color: var(--t-muted);
}

.acad-authors strong {
    color: var(--t-text);
    font-weight: 600;
}

/* Materials */
.acad-materials {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px dashed var(--t-border);
}

.acad-group + .acad-group {
    margin-top: 14px;
}

.acad-group-title {
    display: block;
    margin-bottom: 8px;
    font-size: 0.8em;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--t-muted);
}

.acad-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.acad-btn {
    overflow-wrap: normal;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--t-text);
    font-size: 0.88em;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
}

.acad-btn:hover,
.acad-btn:focus {
    background: var(--accent);
    color: #0f0f23;
    text-decoration: none;
}

.acad-btn .fa {
    color: var(--accent);
}

.acad-btn:hover .fa,
.acad-btn:focus .fa {
    color: #0f0f23;
}

.acad-btn-pdf {
    flex-shrink: 0;
    white-space: nowrap;
    padding: 0 5px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.12);
    font-size: 0.7em;
    font-weight: 700;
    letter-spacing: 0.05em;
}

@media (max-width: 768px) {
    .acad-grid {
        grid-template-columns: 1fr;
    }
}
</style>
